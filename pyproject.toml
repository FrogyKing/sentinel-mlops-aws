[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-mlops"
version = "0.1.0"
description = "Portable fraud detection and controlled MLOps on AWS"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.34", "mangum>=0.19", "pydantic>=2.10",
  "numpy>=2.2", "pandas>=2.2", "scipy>=1.15", "scikit-learn>=1.6",
  "joblib>=1.4", "boto3>=1.36", "streamlit>=1.42", "plotly>=5.10,<6",
  "requests>=2.32", "pyarrow>=19",
]

[project.optional-dependencies]
tracking = ["mlflow>=3.0"]
drift = ["evidently>=0.7"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6", "httpx>=0.28", "ruff>=0.11", "mypy>=1.15", "pandas-stubs>=2.2", "types-requests>=2.32", "pip-audit>=2.9", "bandit>=1.8"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = [".venv", "infrastructure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
